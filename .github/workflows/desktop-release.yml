name: Desktop Release

# Tag push only — normal commits never publish a desktop installer.
# Vercel continues to deploy web from branch pushes independently.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert tag matches apps/desktop/package.json
        run: node scripts/assert-desktop-tag-version.mjs ${{ github.ref_name }}

      - name: Desktop typecheck
        run: npm run typecheck --workspace=@aurum/desktop

      - name: Desktop tests
        run: npm run test --workspace=@aurum/desktop

      - name: Build desktop
        run: npm run build --workspace=@aurum/desktop

      - name: Stage packaged app
        run: node apps/desktop/scripts/stage-pack.mjs

      - name: Package NSIS + publish GitHub Release
        working-directory: apps/desktop
        env:
          # electron-builder publish credential (CI only — never bundled into the app)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned private builds — do not discover/use code signing identities
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --config electron-builder.yml --publish always

      - name: Verify updater artifacts
        run: node scripts/verify-desktop-release-artifacts.mjs

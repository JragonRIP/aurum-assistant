name: Desktop Release

# Tag push only — normal commits never publish a desktop installer.
# Vercel continues to deploy web from branch pushes independently.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Assert tag matches apps/desktop/package.json
        run: node scripts/assert-desktop-tag-version.mjs ${{ github.ref_name }}

      - name: Desktop typecheck
        run: npm run typecheck --workspace=@aurum/desktop

      - name: Desktop tests
        run: npm run test --workspace=@aurum/desktop

      - name: Cache Hugging Face Kokoro model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub/models--hexgrad--Kokoro-82M
            apps/voice-engine/.venv
          key: voice-engine-kokoro-${{ runner.os }}-${{ hashFiles('apps/voice-engine/requirements.txt') }}

      - name: Build desktop
        run: npm run build --workspace=@aurum/desktop

      - name: Prepare packaged voice engine
        run: node apps/voice-engine/scripts/prepare-packaged-runtime.mjs

      - name: Stage packaged app
        run: node apps/desktop/scripts/stage-pack.mjs

      - name: Assert no unresolved workspace imports in stage
        working-directory: apps/desktop
        run: node scripts/assert-no-workspace-requires.mjs app-dist

      - name: Assert voice engine resources staged
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/desktop/resources/voice-engine/server.py")) { throw "missing voice-engine/server.py" }
          if (-not (Test-Path "apps/desktop/resources/voice-engine/engine.json")) { throw "missing engine.json" }
          if (-not (Test-Path "apps/desktop/resources/voice-engine/runtime/python.exe")) { throw "missing runtime python" }
          if (-not (Test-Path "apps/desktop/resources/voice-engine/models/hub/models--hexgrad--Kokoro-82M")) { throw "missing Kokoro model cache" }

      - name: Package NSIS + publish GitHub Release
        working-directory: apps/desktop
        env:
          # electron-builder publish credential (CI only — never bundled into the app)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned private builds — do not discover/use code signing identities
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --config electron-builder.yml --publish always

      - name: Verify updater artifacts
        run: node scripts/verify-desktop-release-artifacts.mjs

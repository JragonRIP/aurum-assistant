appId: com.aurum.assistant
productName: Aurum Console
copyright: Copyright (c) Aurum
# Keep stable EXE basename so upgrades from Aurum 0.2.x stay on the same binary identity.
executableName: Aurum

# Staged by scripts/stage-pack.mjs (avoids .gitignore excluding dist/)
directories:
  app: app-dist
  output: release
  buildResources: build

files:
  - "**/*"

extraMetadata:
  name: aurum
  main: dist/main/index.js

asar: true
asarUnpack:
  - "**/*.exe"
  - "**/loudness/**"
npmRebuild: false
electronVersion: 35.7.5

# Public GitHub Releases — installed app needs no GH_TOKEN to download updates.
publish:
  provider: github
  owner: JragonRIP
  repo: aurum-assistant
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Aurum-Console-Setup-${version}.exe
  icon: build/icon.ico
  # Private unsigned build: skip winCodeSign (avoids Windows symlink privilege errors).
  # EXE icon + version strings are applied in afterPack via the rcedit package.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Aurum Console
  uninstallDisplayName: Aurum Console
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # Remove pre-Console shortcuts named "Aurum" (same install identity).
  include: build/installer.nsh

forceCodeSigning: false

afterPack: scripts/after-pack.cjs

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>Aurum</title>
    <style>
      :root {
        --bg: rgba(12, 12, 14, 0.96);
        --border: rgba(255, 255, 255, 0.1);
        --gold: #c4a574;
        --text: #f2efe9;
        --muted: #9a9690;
        --dim: #6b6862;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        -webkit-app-region: drag;
      }
      .panel {
        height: 100%; margin: 10px; padding: 22px 24px 18px;
        border-radius: 16px; border: 1px solid var(--border);
        background: var(--bg);
        box-shadow: 0 20px 56px rgba(0,0,0,0.55);
        display: flex; flex-direction: column;
        animation: enter 160ms ease-out;
      }
      @keyframes enter {
        from { opacity: 0; transform: translateY(10px) scale(0.985); }
        to { opacity: 1; transform: none; }
      }
      .top {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 20px;
      }
      .brand {
        letter-spacing: 0.22em; font-size: 11px; text-transform: uppercase;
        color: var(--gold); font-weight: 600;
      }
      .status {
        font-size: 12px; color: var(--muted); letter-spacing: 0.06em;
        text-transform: uppercase; -webkit-app-region: no-drag;
      }
      .orb-wrap {
        display: flex; align-items: center; justify-content: center;
        padding: 18px 0 10px;
      }
      .orb {
        width: 22px; height: 22px; border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 0 8px rgba(196,165,116,0.12);
      }
      .orb.thinking { animation: pulse 1.1s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      .command {
        margin-top: 8px; -webkit-app-region: no-drag;
      }
      .command input {
        width: 100%; border: none; outline: none;
        background: transparent; color: var(--text);
        font-size: 18px; font-weight: 400; padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .command input::placeholder { color: var(--dim); }
      .pair {
        margin-top: 12px; -webkit-app-region: no-drag;
        display: none; gap: 8px; flex-direction: column;
      }
      .pair.visible { display: flex; }
      .pair input {
        width: 100%; padding: 10px 12px; border-radius: 8px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.03);
        color: var(--text); font-size: 15px; letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .pair button, .secondary {
        align-self: flex-start; margin-top: 4px;
        background: transparent; border: 1px solid var(--gold);
        color: var(--gold); border-radius: 8px; padding: 8px 14px;
        font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
        cursor: pointer; -webkit-app-region: no-drag;
      }
      .hint {
        margin-top: auto; padding-top: 16px;
        text-align: center; font-size: 12px; color: var(--dim); line-height: 1.45;
      }
      kbd {
        font-family: inherit; border: 1px solid var(--border);
        border-radius: 4px; padding: 1px 5px; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="top">
        <div class="brand">Aurum</div>
        <div class="status" id="status">Idle</div>
      </div>
      <div class="orb-wrap"><div class="orb" id="orb" aria-hidden="true"></div></div>
      <div class="command" id="commandWrap">
        <input id="command" type="text" placeholder="What do you need?" autocomplete="off" spellcheck="false" />
      </div>
      <div class="pair" id="pairWrap">
        <input id="pairCode" type="text" placeholder="PAIRING CODE" maxlength="12" />
        <button type="button" id="pairBtn">Connect Windows device</button>
      </div>
      <p class="hint" id="hint">
        Press <kbd>Enter</kbd> to send · <kbd>Esc</kbd> to dismiss
      </p>
    </div>
    <script src="./overlay.js"></script>
  </body>
</html>
